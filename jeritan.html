<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Jeritan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Tata letak: map perkara terbuka di atas meja - pelat ruangan di kiri,
   kolom berkas berjalan di kanan, menumpuk jadi satu kolom di layar sempit. */
:root{
  --ink:#08090b;
  --panel:#111419;
  --panel2:#171c22;
  --raise:#1f262e;
  --line:#2e3942;
  --edge:#475764;
  --fg:#dbe1e6;
  --dim:#7f8d99;
  --faint:#55626d;
  --manila:#cdb98c;
  --manila-ink:#241e14;
  --amber:#d8933a;
  --red:#b5332d;
  --sick:#7d8f63;
  --wall:#141a20;
  --floor:#0e141a;
  --obj:#1e2830;
  --obj2:#27333c;
  --font-display:"Special Elite","Courier New",ui-monospace,monospace;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-data:"IBM Plex Mono","Consolas",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--fg);
  font-family:var(--font-body);font-size:15px;line-height:1.55;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
#app{display:flex;flex-direction:column;min-height:100%}

/* ---- bilah atas ---- */
.bar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;
  padding-block:9px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.badge{
  font-family:var(--font-display);font-size:13px;letter-spacing:.06em;
  color:var(--amber);border:1px solid var(--line);border-radius:2px;
  padding:2px 8px;white-space:nowrap;
}
.bar .meta{font-family:var(--font-data);font-size:12px;color:var(--dim);white-space:nowrap}
.bar .meta b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.nerve{display:flex;align-items:center;gap:6px;font-family:var(--font-data);font-size:11px;letter-spacing:.08em;color:var(--dim)}
.pips{display:flex;gap:3px}
.pip{width:9px;height:14px;border:1px solid var(--line);background:transparent}
.pip.on{background:var(--red);border-color:var(--red)}
@media (prefers-reduced-motion:no-preference){ .pip.on:last-of-type{animation:thump 1.1s ease-in-out infinite} }
@keyframes thump{0%,100%{opacity:1}50%{opacity:.45}}
.bar .spacer{flex:1 1 20px}
.tool{
  background:var(--panel2);border:1px solid var(--line);border-radius:2px;
  padding:5px 11px;cursor:pointer;font-size:13px;letter-spacing:.02em;
}
.tool:hover{background:var(--raise);border-color:var(--faint)}
.tool:focus-visible,.hs:focus-visible,.opt:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.tool .n{color:var(--amber);font-family:var(--font-data);font-size:12px}
.tool.snd{min-width:92px}

/* ---- utama ---- */
main{
  flex:1 1 auto;display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:22px;
  width:100%;max-width:1320px;margin:0 auto;padding-block:22px 34px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:18px}}
main.solo{display:block}

.scene{min-width:0;display:flex;flex-direction:column;gap:12px}
.roomhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.roomhead h2{font-family:var(--font-display);font-size:23px;letter-spacing:.02em}
.roomhead .sub{font-family:var(--font-data);font-size:12px;color:var(--faint)}

.plate{
  position:relative;border:1px solid var(--line);background:var(--wall);
  aspect-ratio:800/450;width:100%;max-width:100%;overflow:hidden;
}
.plate svg{display:block;width:100%;height:100%}
.plate::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 44%,rgba(0,0,0,0) 46%,rgba(0,0,0,.42) 100%);
}
.plate.dark::after{
  background:radial-gradient(ellipse at 50% 38%,rgba(0,0,0,0) 36%,rgba(0,0,0,.6) 100%);
}
.hs{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;align-items:center;gap:7px;
  background:rgba(8,9,11,.8);border:1px solid var(--faint);border-radius:2px;
  padding:3px 8px 3px 5px;cursor:pointer;
  font-family:var(--font-data);font-size:11.5px;letter-spacing:.02em;
  color:var(--fg);backdrop-filter:blur(2px);white-space:nowrap;z-index:2;
}
.plate.enter svg{animation:platein .45s ease-out both}
@keyframes platein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.plate.enter svg{animation:none}}
.tool,.opt{transition:background .14s ease,border-color .14s ease}
.hs{transition:border-color .14s ease,background .14s ease;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.hs .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none;box-shadow:0 0 0 3px rgba(216,147,58,.18)}
.hs:hover{border-color:var(--amber);background:rgba(8,9,11,.96)}
.hs.done{color:var(--faint);border-color:#242d35;cursor:default}
.hs.done .dot{background:#242d35;box-shadow:none}
.hs.act .dot{background:var(--red);box-shadow:0 0 0 3px rgba(181,51,45,.22)}
@media (prefers-reduced-motion:no-preference){
  .hs:not(.done) .dot{animation:tick 2.4s ease-in-out infinite}
  @keyframes tick{0%,100%{box-shadow:0 0 0 2px rgba(216,147,58,.16)}50%{box-shadow:0 0 0 6px rgba(216,147,58,.05)}}
}
.moves{display:flex;flex-wrap:wrap;gap:8px}
.moves .lbl{font-family:var(--font-data);font-size:11px;letter-spacing:.1em;color:var(--faint);align-self:center;margin-right:2px}

/* ---- kolom berkas ---- */
.side{min-width:0;display:flex;flex-direction:column;gap:12px}
.log{
  border:1px solid var(--line);background:var(--panel);
  padding:14px 15px;display:flex;flex-direction:column;gap:14px;
  flex:1 1 auto;min-height:340px;max-height:74vh;overflow-y:auto;
}
@media (max-width:900px){.log{min-height:0;max-height:58vh}}
.entry{border-left:2px solid var(--line);padding-left:11px}
.entry .h{font-family:var(--font-data);font-size:10.5px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
.entry p{margin:3px 0 0}
.entry.find{border-left-color:var(--amber)}
.entry.find .h{color:var(--amber)}
.entry.say{border-left-color:var(--faint)}
.entry.say p{color:#ccd4db;font-style:italic}
.entry.warn{border-left-color:var(--red)}
.entry.warn .h{color:var(--red)}
.entry.cold{border-left-color:var(--sick)}
.entry.cold .h{color:var(--sick)}
.entry.cold p{color:#b9c4c2}
.entry.beat p{color:var(--dim)}

/* ---- modal ---- */
.scrim{
  position:fixed;inset:0;z-index:40;background:rgba(4,5,7,.86);
  display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:clamp(14px,5vh,54px) max(16px,env(safe-area-inset-left,0px)) 54px;
}
.sheet{
  width:100%;max-width:720px;background:var(--panel);
  border:1px solid var(--line);border-top:3px solid var(--amber);
  padding:20px 22px 24px;
}
.sheet.file{background:var(--manila);color:var(--manila-ink);border-top-color:#7d6836}
.sheet h3{font-family:var(--font-display);font-size:20px;margin-bottom:4px}
.sheet .kicker{font-family:var(--font-data);font-size:11px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.sheet.file .kicker{color:#63542f}
.sheet .rule{height:1px;background:var(--line);margin:14px 0}
.sheet.file .rule{background:#a8956a}
.close{position:sticky;top:0;float:right;background:none;border:1px solid var(--line);padding:2px 9px;cursor:pointer;font-family:var(--font-data);font-size:12px}
.sheet.file .close{border-color:#7d6836;color:var(--manila-ink)}

.fields{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:0}
.fields dt{font-family:var(--font-data);font-size:11px;letter-spacing:.08em;color:#63542f;text-transform:uppercase;padding-top:3px}
.fields dd{margin:0}
.annex{border:1px dashed #7d6836;padding:11px 13px;margin-top:14px;background:rgba(255,255,255,.2)}
.annex h4{margin:0 0 5px;font-family:var(--font-data);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.stamp{
  display:inline-block;transform:rotate(-4deg);border:2px solid var(--red);color:var(--red);
  font-family:var(--font-display);font-size:14px;letter-spacing:.08em;padding:3px 10px;margin-top:16px;opacity:.85;
}

.opts{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.opt{
  text-align:left;background:var(--panel2);border:1px solid var(--line);
  padding:10px 13px;cursor:pointer;display:flex;gap:11px;align-items:flex-start;
}
.opt:hover:not(:disabled){background:var(--raise);border-color:var(--faint)}
.opt:disabled{opacity:.42;cursor:default}
.opt .q{flex:1 1 auto;min-width:0}
.opt .tagline{font-family:var(--font-data);font-size:10.5px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase;display:block;margin-top:3px}
.opt.press{border-color:var(--red);background:rgba(181,51,45,.1)}
.opt.press .tagline{color:var(--red)}
.opt.on{border-color:var(--amber);background:rgba(216,147,58,.12)}
.opt .mark{font-family:var(--font-data);color:var(--faint);flex:none}
.opt.on .mark{color:var(--amber)}

.group{margin-top:16px}
.group>h4{font-family:var(--font-data);font-size:11px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;margin:0 0 7px}
.ex{border:1px solid var(--line);padding:9px 12px;margin-bottom:7px;background:var(--panel2)}
.ex .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex .t b{font-weight:600;font-size:14px}
.ex .w{font-family:var(--font-data);font-size:10px;letter-spacing:.1em;color:var(--faint);white-space:nowrap}
.ex .w.s3{color:var(--amber)}
.ex p{margin:5px 0 0;font-size:13.5px;color:#c0c9d1}
.empty{color:var(--dim);font-style:italic}

.bigbtn{
  display:block;width:100%;margin-top:18px;background:var(--amber);color:#17120a;
  border:none;padding:12px;cursor:pointer;font-family:var(--font-display);
  font-size:15px;letter-spacing:.06em;
}
.bigbtn:hover{filter:brightness(1.08)}
.bigbtn:disabled{background:var(--panel2);color:var(--faint);cursor:default;filter:none}
.ghost{background:none;border:1px solid var(--line);color:var(--fg)}
.ghost:hover{background:var(--panel2);filter:none}

.title{
  max-width:680px;margin:0 auto;padding-block:clamp(26px,9vh,80px) 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.title .no{font-family:var(--font-data);font-size:12px;letter-spacing:.2em;color:var(--amber)}
.title h1{font-family:var(--font-display);font-size:clamp(34px,8vw,52px);line-height:1.04;margin:10px 0 14px}
.title .lede{font-size:16px;color:#c4ced6;max-width:60ch}
.title .call{
  border:1px solid var(--line);border-left:3px solid var(--red);background:var(--panel);
  padding:13px 16px;margin:22px 0;font-family:var(--font-data);font-size:13px;color:#c4ced6;
}
.title .call b{color:var(--fg)}
.cred{margin-top:26px;font-size:12.5px;color:var(--faint);font-family:var(--font-data)}

.verdict{font-family:var(--font-display);font-size:clamp(24px,5vw,34px);line-height:1.1;margin:6px 0 2px}
.verdict.good{color:var(--amber)}
.verdict.bad{color:var(--red)}
.scoreline{display:flex;flex-wrap:wrap;gap:6px 20px;font-family:var(--font-data);font-size:12px;color:var(--dim);margin-top:10px}
.scoreline b{color:var(--fg);font-variant-numeric:tabular-nums}
.truth{border:1px solid var(--line);background:var(--panel2);padding:14px 16px;margin-top:18px}
.truth h4{font-family:var(--font-data);font-size:11px;letter-spacing:.12em;color:var(--amber);text-transform:uppercase;margin:0 0 7px}
.truth p{margin:0 0 9px}
.truth p:last-child{margin:0}
</style>

<div id="app">
  <header class="bar" id="bar" hidden>
    <span class="badge">PERKARA 7731-K</span>

    <span class="nerve">KEGELISAHANNYA<span class="pips" id="pips"></span></span>
    <span class="spacer"></span>
    <button class="tool snd" id="btnSnd">Suara: nyala</button>
    <button class="tool" id="btnFile">Berkas perkara</button>

  </header>

</div>

<script>
"use strict";

/* ============================================================ suara
   Semua bunyi dibangkitkan di dalam kode: dengung ruangan, detak,
   desah monitor, derit pintu. Tidak ada berkas audio dari luar. */
const SND=(()=>{
  let ac=null,master=null,drone=false,heart=null,amb=null,muted=false,lastN=-1;
  try{ muted = localStorage.getItem("lw_mute")==="1"; }catch(e){}
  function ctx(){
    if(ac) return ac;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return null;
      ac=new AC();
      master=ac.createGain();
      master.gain.value=muted?0:0.5;
      master.connect(ac.destination);
    }catch(e){ ac=null; }
    return ac;
  }
  function tone(f,dur,type,vol,to){
    const c=ctx(); if(!c) return;
    try{
      const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
      o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
      if(to) o.frequency.exponentialRampToValueAtTime(Math.max(20,to),t+dur);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol||0.2,t+Math.min(0.08,dur/3));
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.06);
    }catch(e){}
  }
  function hiss(dur,f,q,vol,fade){
    const c=ctx(); if(!c) return;
    try{
      const len=Math.max(1,Math.floor(c.sampleRate*dur));
      const buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<len;i++){ const k=i/len; d[i]=(Math.random()*2-1)*(fade?Math.sin(Math.PI*k):(1-k)); }
      const n=c.createBufferSource(); n.buffer=buf;
      const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=f||1200; bp.Q.value=q||1;
      const g=c.createGain(); g.gain.value=vol||0.12;
      n.connect(bp); bp.connect(g); g.connect(master); n.start();
    }catch(e){}
  }
  function startDrone(){
    const c=ctx(); if(!c||drone) return; drone=true;
    try{
      const g=c.createGain(); g.gain.setValueAtTime(0.0001,c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.5,c.currentTime+8);
      g.connect(master);
      const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=170; lp.Q.value=4; lp.connect(g);
      [[48.5,"sawtooth",0.5],[49.1,"sawtooth",0.4],[72.8,"triangle",0.22]].forEach(([f,t,v])=>{
        const o=c.createOscillator(); o.type=t; o.frequency.value=f;
        const og=c.createGain(); og.gain.value=v;
        o.connect(og); og.connect(lp); o.start();
      });
      const lfo=c.createOscillator(); lfo.frequency.value=0.06;
      const lg=c.createGain(); lg.gain.value=55;
      lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
      amb=setInterval(()=>{
        const r=Math.random();
        if(r<0.34) hiss(2.2,320+Math.random()*260,7,0.03,true);        /* pipa */
        else if(r<0.6) tone(1180+Math.random()*500,2.4,"sine",0.012);  /* dering telinga */
        else if(r<0.78) tone(41,1.6,"sine",0.1);                       /* sesuatu di bawah */
        else hiss(0.5,140,3,0.035,true);                               /* lantai */
      },11000);
    }catch(e){}
  }
  function beat(){ tone(54,0.26,"sine",0.34); setTimeout(()=>tone(47,0.2,"sine",0.2),165); }
  return {
    boot(){ const c=ctx(); if(c&&c.state==="suspended"){ try{c.resume();}catch(e){} } startDrone(); },
    ui(){ hiss(0.035,2400,2,0.05); },
    find(){ hiss(0.05,900,2,0.06); tone(168,0.16,"triangle",0.1); },
    page(){ hiss(0.12,1700,1.5,0.045); },
    sting(){ tone(233,0.9,"sawtooth",0.055); tone(220,0.9,"sawtooth",0.05); hiss(0.3,2600,6,0.03,true); },
    door(){ tone(132,1.5,"sawtooth",0.045,58); hiss(1.4,420,9,0.05,true); },
    breath(){ hiss(1.5,520,6,0.085,true); setTimeout(()=>hiss(1.1,380,7,0.06,true),1750); },
    scream(){
      tone(760,1.1,"sawtooth",0.1,170); tone(1150,0.9,"square",0.03,240);
      hiss(1.2,1500,2,0.09,true); setTimeout(()=>tone(44,2.4,"sine",0.16),700);
    },
    knock(){ tone(120,0.1,"triangle",0.22); setTimeout(()=>tone(110,0.1,"triangle",0.2),230); setTimeout(()=>tone(104,0.12,"triangle",0.18),470); },
    heart(n){
      if(n===lastN) return; lastN=n;
      if(heart){ clearInterval(heart); heart=null; }
      if(n<0||!ctx()) return;
      const ms=Math.max(560,1500-n*150);
      beat(); heart=setInterval(beat,ms);
    },
    stop(){ if(heart){clearInterval(heart);heart=null;} lastN=-1; },
    muted(){ return muted; },
    toggle(){
      muted=!muted;
      try{ localStorage.setItem("lw_mute",muted?"1":"0"); }catch(e){}
      if(master){ try{ master.gain.setTargetAtTime(muted?0:0.5,ac.currentTime,0.08); }catch(e){} }
      return muted;
    }
  };
})();

/* ============================================================ data */

const CLUES = {
  /* bordes ------------------------------------------------------------- */
  jeritan:{at:"doorstep",w:2,name:"Jeritan dari bawah lantai",
    text:"Bu Brauer, flat 2, empat puluh satu tahun di gedung ini: “Jeritan. Kamis malam, dan tadi malam lagi. Bukan kata-kata — perempuan, terus-menerus, lalu berhenti sekaligus, dan yang berhenti sekaligus itu justru yang bikin saya tidak bisa tidur. Dan bukan dari flatnya. Dari bawah lantai saya.”"},
  asing:{at:"doorstep",w:1,name:"Orang asing di tangga",
    text:"“Senin saya menyapanya di bordes dan dia menatap tembus saya seperti saya kaca jendela. Rambutnya lebih gelap. Lebih tinggi karena sepatunya. Enam tahun saya kenal anak itu, Pak, dan Senin itu saya mengucapkan selamat malam kepada orang asing.”"},
  tamu:{at:"doorstep",w:2,name:"Perempuan dengan tas besar",
    text:"“Dua pekan lalu ada perempuan naik tangga bawa tas jinjing besar, larut sekali, pakai parka. Saya pikir Stesya habis pergi dan pulang. Saya lihat dari lubang pintu: dia berdiri di depan pintu flat 3 lama sekali sebelum masuk. Seperti orang yang mau yakin dulu rumahnya kosong.”"},

  /* lorong depan -------------------------------------------------------- */
  kait:{at:"hall",w:2,name:"Kait yang kosong",
    text:"Empat kait di dekat pintu, dilabeli spidol dengan tulisan tangan rapi: FLAT · SEPEDA · POS · BAWAH TANAH. Tiga kunci tergantung. Kait bawah tanah kosong, dan kaitnya sendiri bersih — dipegang berkali-kali belakangan ini."},
  monitor:{at:"hall",w:3,name:"Penerima monitor bayi",nerve:1,
    text:"Di rak lorong, penerima monitor bayi model lama. Lampunya hijau: menyala, dan masih berpasangan dengan pemancarnya di suatu tempat. Volumenya hampir nol. Saya berdiri diam di depannya sampai saya bisa menghitungnya, dan di balik desis itu ada napas. Bukan napas saya, dan bukan napas dia, karena dia sedang bicara di belakang saya waktu saya menghitungnya."},
  parka:{at:"hall",w:3,name:"Label binatu di parka",
    text:"Di gantungan, sebuah parka yang dua ukuran terlalu besar untuk siapa pun yang tinggal di sini. Dijahit di dalam kerahnya, label binatu lembaga: BIRCHFIELD RESIDENTIAL CARE · 41."},

  /* ruang tamu ---------------------------------------------------------- */
  foto:{at:"living",w:3,name:"Dua anak di dalam foto",

/* ---- gambar ruangan ---- */
/* ---- gambar ruangan ---------------------------------------------------
   Setiap ruangan adalah kotak perspektif satu titik: dinding belakang,
   dua dinding samping, lantai dan langit-langit yang menyempit ke titik
   hilang di (400,214). Benda digambar sebagai prisma dengan tiga muka -
   muka depan, muka atas yang lebih terang, muka samping yang lebih gelap -
   supaya arah cahayanya konsisten dengan lampu di langit-langit. Di atas
   segalanya ada bayangan kontak yang diburamkan dan satu lapis butiran. */

const WALL={l:140,r:660,t:92,b:336};

/* bahan: [muka depan, muka atas, muka samping] */
const MAT={
  wood:["#33271c","#43341f","#241b13"],
  dark:["#1c242b","#28323a","#141a1f"],
  pale:["#2b343c","#39444d","#1d242a"],
  cloth:["#272d35","#333a44","#1b2027"],
  metal:["#333d46","#424e59","#242c33"],
  white:["#39414a","#49535d","#272e35"],
  rust:["#3a2a22","#48352a","#271c17"]
};

function defs(opt){
  const o=opt||{};
  return `<defs>
    <linearGradient id="gw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${o.wallTop||"#0e141a"}"/>
      <stop offset="0.62" stop-color="${o.wallMid||"#1b242c"}"/>
      <stop offset="1" stop-color="${o.wallBot||"#11181e"}"/>
    </linearGradient>
    <linearGradient id="gf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${o.floorBack||"#1a222a"}"/>
      <stop offset="1" stop-color="${o.floorFront||"#080c10"}"/>
    </linearGradient>
    <linearGradient id="gc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05080a"/><stop offset="1" stop-color="#121a21"/>
    </linearGradient>
    <radialGradient id="gl" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="${o.light||"#f0b45c"}" stop-opacity="${o.lightA||0.3}"/>
      <stop offset="0.45" stop-color="${o.light||"#f0b45c"}" stop-opacity="${(o.lightA||0.3)*0.28}"/>
      <stop offset="1" stop-color="${o.light||"#f0b45c"}" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gglass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121a22"/><stop offset="0.5" stop-color="#1d2831"/><stop offset="1" stop-color="#0b1016"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>`;
}

/* kotak ruangan: lantai, langit-langit, dua dinding samping, dinding belakang */
function shell(o){
  o=o||{};
  const W=WALL, side=o.side||"#0d1319", ceil=o.ceil!==false;
  return `
  <rect x="0" y="0" width="800" height="450" fill="#06080a"/>
  <path d="M0 450 L800 450 L${W.r} ${W.b} L${W.l} ${W.b} Z" fill="url(#gf)"/>
  <g stroke="#000" stroke-opacity=".32" stroke-width="1" fill="none">
    <path d="M205 ${W.b} L24 450 M270 ${W.b} L149 450 M335 ${W.b} L274 450 M400 ${W.b} L400 450 M465 ${W.b} L526 450 M530 ${W.b} L651 450 M595 ${W.b} L776 450"/>
    <path d="M96 392 L704 392" stroke-opacity=".18"/>
    <path d="M48 424 L752 424" stroke-opacity=".14"/>
  </g>
  ${ceil?`<path d="M0 0 L800 0 L${W.r} ${W.t} L${W.l} ${W.t} Z" fill="url(#gc)"/>`:""}
  <path d="M0 0 L${W.l} ${W.t} L${W.l} ${W.b} L0 450 Z" fill="${side}"/>
  <path d="M800 0 L${W.r} ${W.t} L${W.r} ${W.b} L800 450 Z" fill="${side}"/>
  <rect x="${W.l}" y="${W.t}" width="${W.r-W.l}" height="${W.b-W.t}" fill="url(#gw)"/>
  <g stroke="#000" stroke-opacity=".5" fill="none">
    <path d="M0 0 L${W.l} ${W.t} M800 0 L${W.r} ${W.t} M0 450 L${W.l} ${W.b} M800 450 L${W.r} ${W.b}"/>
    <rect x="${W.l}" y="${W.t}" width="${W.r-W.l}" height="${W.b-W.t}"/>
  </g>
  <path d="M0 450 L800 450 L${W.r} ${W.b} L${W.l} ${W.b} Z" fill="#000" opacity=".28"/>`;
}

/* genangan cahaya di lantai */
function pool(x,y,rx,ry,op){
  return `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="url(#gl)" opacity="${op==null?1:op}"/>`;
}
/* bayangan kontak */
function shade(x,y,rx,ry,op){
  return `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#000" opacity="${op||0.5}" filter="url(#blur)"/>`;
}
/* prisma tiga muka; d>0 menghadap kanan, d<0 menghadap kiri */
function prism(x,y,w,h,d,mat,extra){
  const m=MAT[mat]||MAT.dark, a=Math.abs(d), dir=d<0?-1:1;
  return `<g>
    <path d="M${x} ${y} l${a*dir} ${-a*0.46} h${w} l${-a*dir} ${a*0.46} z" fill="${m[1]}"/>
    <path d="M${x+(dir>0?w:0)} ${y} l${a*dir} ${-a*0.46} v${h} l${-a*dir} ${a*0.46} z" fill="${m[2]}"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${m[0]}"/>
    ${extra||""}
  </g>`;
}
/* panel datar di dinding belakang dengan tepi bercahaya tipis */
function panel(x,y,w,h,fill,stroke){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="${stroke||"#000"}" stroke-opacity=".55"/>
  <path d="M${x} ${y+h} h${w}" stroke="#56646f" stroke-opacity=".3"/>`;
}
function grain(op){
  return `<rect x="0" y="0" width="800" height="450" filter="url(#grain)" opacity="${op||0.075}" style="mix-blend-mode:overlay"/>`;
}
/* bohlam gantung */
function bulb(x,y,len,r){
  return `<path d="M${x} 0 V${y-(r||8)}" stroke="#2b343c" stroke-width="2"/>
  <circle cx="${x}" cy="${y}" r="${r||8}" fill="#ffd79a" filter="url(#glow)"/>
  <circle cx="${x}" cy="${y}" r="${(r||8)*2.6}" fill="#ffc470" opacity=".12"/>`;
}

function heavy(){ return Object.keys(S.found).filter(k=>CLUES[k].w===3).length; }
function nFound(){ return Object.keys(S.found).length; }
function hhmm(m){ const h=Math.floor(m/60)%24, x=m%60; return String(h).padStart(2,"0")+":"+String(x).padStart(2,"0"); }
function tick(m){ S.clock+=m; }

function say(kind,head,text){
  S.log.push({kind,head,text});
  if(S.log.length>70) S.log.shift();
}

function find(id,extra){
  if(S.found[id]) return false;
  const c=CLUES[id];
  S.found[id]=true;
  say("find",c.name,(extra?extra+" ":"")+c.text);
  SND.find();
  if(c.nerve) nerveUp(c.nerve,5);
  if(!S.gone && S.nerve>=4 && S.creep<CREEPS.length && S.phase==="flat" && S.room!=="cellar"){
    say("cold","Di belakang saya",CREEPS[S.creep++]);
  }
  return true;
}

function nerveUp(n,cap){
  if(S.gone) return;
  const before=S.nerve;
  /* Menggeledah membuatnya gelisah, tapi tidak pernah sampai membuatnya
     kabur: hanya desakan yang mendorongnya melewati angka lima. */
  const lim=Math.min(cap||7,7);
  S.nerve=Math.max(S.nerve,Math.min(S.nerve+n,lim));
  SND.heart(Math.min(6,S.nerve));
  if(before<3 && S.nerve>=3) say("beat","Satu ruangan di belakang","Dia berhenti menawari teh. Sekarang dia mengikuti saya, satu ruangan di belakang. Kalau saya berhenti, langkahnya berhenti setengah langkah kemudian — bukan bersamaan, tapi setelahnya.");
  if(before<5 && S.nerve>=5){
    say("warn","Dia ingin saya keluar","Dia berdiri di pintu lorong dengan punggung menghadap pintu bawah tanah. “Saya rasa Bapak datang lagi saja kalau sudah ada suratnya. Sekarang saya minta Bapak keluar.” Tangan kirinya mengepal dan membuka, mengepal dan membuka.");
    SND.sting();
  }
  if(before<6 && S.nerve>=6 && !S.coat){
    S.coat=true;
    say("warn","Dia mengambil mantelnya","Dia menurunkan parka itu dari gantungan dan menyampirkannya di lengan. Ada bunyi logam kecil dari sakunya, sekali. Dan sekarang dia berdiri lebih dekat ke pintu depan daripada saya.");
    SND.sting();
  }
}

function maybeLeave(){
  if(!S.coat||S.gone||S.down) return;
  S.gone=true;
  SND.door();
  if(S.key){
    say("warn","Pintu depan berbunyi","Dia sudah di tangga sebelum saya sampai ke lorong. Mantel dipakai, tidak bawa apa-apa. Kunci kuningan itu ada di saku saya dan dia tidak tahu.");
  }else{
    say("warn","Pintu depan berbunyi","Dia sudah di tangga dan keluar ke Lindenweg sebelum saya sampai ke lorong. Apa pun yang berbunyi logam di saku itu ikut pergi bersamanya.");
  }
}

/* ============================================================ render */

function render(){
  document.getElementById("bar").hidden = (S.phase==="title");
  document.getElementById("clock").textContent = hhmm(S.clock);
  document.getElementById("bookN").textContent = nFound();
  const pips=document.getElementById("pips");
  pips.innerHTML="";
  for(let i=0;i<6;i++){
    const d=document.createElement("span");
    d.className="pip"+(i<S.nerve?" on":"");
    pips.appendChild(d);
  }
  if(S.phase==="title") return renderTitle();
  if(S.phase==="doorstep") return renderDoorstep();
  renderRoom();
}

function renderTitle(){
  mainEl.className="solo";
  mainEl.innerHTML=`<div class="title">
    <div class="no">PERKARA 7731-K &nbsp;·&nbsp; CEK KESEJAHTERAAN WARGA &nbsp;·&nbsp; 18 OKTOBER, 21:40</div>
    <h1>Jeritan</h1>
    <p class="lede">Anda penyidik piket di Distrik Empat. Dua panggilan masuk dari gedung yang sama dalam sepekan, dan yang kedua jenis panggilan yang tidak diarsipkan sersan jaga, melainkan dinaikkan.</p>
    <div class="call"><b>PELAPOR:</b> H. Brauer, Lindenweg 14, flat 2.<br>
    <b>MELAPORKAN:</b> Jeritan dari bawah lantai pada dua malam. Yakin asalnya dari ruang bawah tanah.<br>
    <b>JUGA MENYATAKAN:</b> Penghuni flat 3, Stesya Varlamova, 29, “bukan dirinya dan rupanya tidak benar” sejak akhir September.</div>
    <p class="lede">Anda punya senter, buku catatan, dan tidak ada surat perintah. Apa pun yang Anda bawa keluar dari flat itu malam ini harus sesuatu yang Anda lihat sambil berdiri di tempat yang sah. Baca berkasnya sebelum mengetuk — ada dua baris di lampiran medis yang akan Anda butuhkan nanti, di bawah sana, waktu ada dua perempuan dengan satu wajah menyebut nama yang sama.</p>
    <button class="bigbtn" id="go">Naik ke lantai dua</button>
    <button class="bigbtn ghost" id="goFile">Baca dulu berkas 7731-K</button>
    <p class="cred">Pakai headphone kalau ada. Geledah ruangannya. Desak dia hanya di tempat Anda bisa menaruh barang bukti di atas meja — setiap kali Anda salah menekan, dia jadi lebih tenang, dan Anda jadi lebih sedikit waktunya.</p>
  </div>`;
  document.getElementById("go").onclick=()=>{
    SND.boot(); SND.knock();
    S.phase="doorstep";
    say("beat","Bordes lantai dua","Tangga batu, bau makan malam orang lain, satu bohlam mati di tikungan. Flat 2 sudah memasang rantai pintu dan sebelah mata sudah ada di celahnya sebelum ketukan saya selesai.");
    render();
  };
  document.getElementById("goFile").onclick=openFile;
}

  const qs=[
    {id:"n1",ask:"Persisnya Ibu dengar apa?",gives:"jeritan",
     say:"“Jeritan. Kamis malam, dan tadi malam lagi, larut. Bukan kata-kata — perempuan, terus-menerus, lalu berhenti sekaligus, dan yang berhenti sekaligus itu yang bikin saya tidak bisa tidur. Dan bukan dari flatnya. Dari bawah lantai saya. Sejak 1984 saya tinggal di atas ruang bawah tanah itu, Pak. Saya tahu apa yang ada di bawah lantai saya.”"},
    {id:"n2",ask:"Kapan terakhir Ibu melihat Stesya sendiri?",gives:"asing",

    {id:"n3",ask:"Ada orang lain yang keluar masuk gedung?",gives:"tamu",

    {id:"n4",ask:"Bisa Ibu lihat foto ini sebentar?",gives:"b_foto",needs:"foto",
     say:"“Bawa ke sini, ke bawah lampu.” Dia menyalakan lampu tangga dengan ujung tongkatnya dan menerima bingkai itu dengan dua tangan."},
    {id:"n5",ask:"Dua malam terakhir, radionya bagaimana?",gives:"b_suara",needs:"monitor",
     say:"“Keras sekali. Suami saya tuli dua puluh tahun dan dia pun ikut bangun.”"}

      <div class="roomhead"><h2>Flat 2 — rantainya tidak dilepas</h2><span class="sub">H. BRAUER, 81, PELAPOR</span></div>
      <div class="plate" id="plate"></div>
      <div class="opts" id="dq"></div>
      <button class="bigbtn" id="knock">${S.entered?"Masuk lagi ke flat 3":(left?"Sudahi dan ketuk pintu flat 3":"Ucapkan terima kasih dan ketuk pintu flat 3")}</button>
    </div>
    <aside class="side"><div class="log" id="log"></div></aside>`;
  document.getElementById("plate").innerHTML=`<svg viewBox="0 0 800 450" aria-label="Bordes gedung dengan dua pintu">${ART.doorstep()}</svg>`;

    const b=document.createElement("button");
    b.className="opt"; b.disabled=!!S.nbrQ[q.id];
    b.innerHTML=`<span class="mark">${S.nbrQ[q.id]?"✓":"•"}</span><span class="q">${q.ask}<span class="tagline">${S.nbrQ[q.id]?"sudah ditanya":"tanya"}</span></span>`;
    b.onclick=()=>{ S.nbrQ[q.id]=true; tick(2); SND.page(); say("say","Bu Brauer, flat 2",q.say); find(q.gives); render(); };
    box.appendChild(b);
  });
  document.getElementById("knock").onclick=enterFlat;
  drawLog();
}

function enterFlat(){
  S.phase="flat"; S.room="hall";
  if(S.entered){
    tick(1); SND.ui();
    say("beat","Masuk lagi","Pintunya tidak dikunci selama saya di luar. Dia berdiri persis di tempat saya meninggalkannya, menghadap pintu, dan menunggu sampai saya selesai mengetuk sebelum membukanya.");
    return render();
  }
  S.entered=true; tick(3);
  SND.knock(); SND.heart(0);
  say("beat","Flat 3 terbuka di ketukan kedua","Perempuan di ambang pintu punya wajah Stesya Varlamova dan kira-kira empat perlima tubuhnya — rahang yang sama, tahi lalat yang sama di bawah mata, rambut warna yang benar dengan dua pekan pertumbuhan yang terlalu gelap di belahannya. Kardigannya ketarik di bahu. “Ini soal Bu Brauer, ya,” katanya, sebelum saya mengatakan apa pun, lalu minggir mempersilakan saya masuk, yang mana orang biasanya tidak begitu.");
  say("beat","Lorong depan","Di belakangnya flat ini sangat rapi dan berbau pemutih di balik bau masakan. Jauh di ujung sana ada radio mendesis. Di ujung lorong ada pintu rendah, dan lantai di depan pintu itu lebih bersih daripada lantai mana pun di flat ini, dalam satu jalur selebar nampan.");
  render();
}

let lastRoom=null;
function renderRoom(){
  mainEl.className="";
  const room=S.room;
  const spots=SPOTS[room]||[];
  const live=spots.filter(s=>!s.after || S[s.after]);
  const look=live.filter(s=>!s.act);
  const seen=look.filter(s=>S.found[s.id]).length;
  const fresh=(lastRoom!==room); lastRoom=room;
  const nav = room==="cellar"
    ? [["hall","Naik kembali"]]
    : [["hall","Lorong"],["living","Ruang tamu"],["kitchen","Dapur"],["bath","Kamar mandi"],["bed","Kamar tidur"]];
  mainEl.innerHTML=`<div class="scene">
      <div class="roomhead"><h2>${ROOM_LABEL[room]}</h2><span class="sub">LINDENWEG 14, FLAT 3 · ${hhmm(S.clock)}${look.length?" · "+seen+"/"+look.length+" DIPERIKSA":""}</span></div>
      <div class="plate${room==="cellar"?" dark":""}${fresh?" enter":""}" id="plate"></div>
      <div class="moves" id="moves"></div>
    </div>
    <aside class="side"><div class="log" id="log"></div></aside>`;
  const plate=document.getElementById("plate");
  plate.innerHTML=`<svg viewBox="0 0 800 450" aria-label="${ROOM_LABEL[room]}">${ART[room]()}</svg>`;
  live.forEach(sp=>{
    const done = sp.act ? false : !!S.found[sp.id];
    const b=document.createElement("button");
    b.className="hs"+(done?" done":"")+(sp.red?" act":"");
    b.style.left=sp.x+"%"; b.style.top=sp.y+"%";
    b.innerHTML=`<span class="dot"></span>${sp.label}${done?" ✓":""}`;
    if(done){ b.disabled=true; } else { b.onclick=()=>search(sp); }
    plate.appendChild(b);
  });
  const moves=document.getElementById("moves");
  moves.innerHTML=`<span class="lbl">PERGI KE</span>`;
  nav.forEach(([id,label])=>{
    if(id===room) return;
    const b=document.createElement("button");
    b.className="tool"; b.textContent=label;
    b.onclick=()=>{ SND.ui(); S.room=id; tick(1); maybeLeave(); render(); };
    moves.appendChild(b);
  });
  const add=(label,fn,off)=>{
    const b=document.createElement("button");
    b.className="tool"; b.textContent=label; b.disabled=!!off; b.onclick=fn;
    moves.appendChild(b);
  };
  if(room==="hall") add("Keluar ke bordes",()=>{
    SND.ui(); S.phase="doorstep"; tick(1);
    say("beat","Keluar sebentar ke bordes","Saya tarik pintu flat sampai hampir rapat dan berdiri di tangga. Di dalam, langkahnya berhenti di tempat saya meninggalkannya, dan tidak pindah selama saya di luar.");
    maybeLeave(); render();
  });
  if(room!=="cellar"){
    add(S.gone?"Dia sudah pergi":"Bicara dengannya",openTalk,S.gone);
    add("Radio ke piket",openRadio);
    add("Tutup berkas dan pulang",openLeave);
  }else{
    add("Radio ke piket",openRadio);
    if(S.opened) add("Tanya perempuan itu",openRescue);
    if(S.opened && !S.named) add("Tetapkan identitas",openIdentify);
    if(S.named) add("Tulis laporan",openReport);
  }
  drawLog();
}

function drawLog(){
  const box=document.getElementById("log");
  if(!box) return;
  box.innerHTML="";
  S.log.forEach(e=>{
    const d=document.createElement("div");
    d.className="entry "+e.kind;
    d.innerHTML=`<div class="h">${e.head}</div><p>${e.text}</p>`;
    box.appendChild(d);
  });
  box.scrollTop=box.scrollHeight;
}

/* ============================================================ tindakan */

function search(sp){
  tick(2);
  if(sp.act==="shoes"){
    SND.ui();
    say("beat","Rak sepatu","Tiga pasang miliknya, ukuran 38, aus di tumit kanan. Satu pasang lebih baru, ukuran 40, lumpur kering di jahitannya. Dan satu sepatu dari yang 38, tanpa pasangan di rak.");
    maybeLeave(); return render();
  }
  if(sp.act==="cellar") return tryCellar();
  if(sp.act==="openbay") return openBay();
  if(sp.needs && !S.found[sp.needs]){
    SND.ui();
    say("beat",sp.label,sp.locked);
    maybeLeave(); return render();
  }
  if(sp.id==="monitor") SND.breath();
  find(sp.id);
  if(sp.id==="kunci"){ S.key=true; say("beat","Masuk saku","Kecil, kuningan, mengilap di bahunya. Masuk ke saku saya tanpa dilihat siapa pun."); }
  maybeLeave();
  render();
}

function tryCellar(){
  if(S.key){
    return goDown("Kunci kuningan dari laci dapur itu memutar gemboknya pada percobaan kedua. Platnya jatuh. Di belakang saya dia menyebut nama saya dengan pangkat yang salah, dua kali, makin pelan.");
  }
  const g=heavy();
  if(g>=5){
    return goDown("Tidak ada kunci, tapi isi buku catatan ini akan memuaskan sersan penjaga mana pun di distrik ini: "+g+" barang bukti kuat dan seorang perempuan menjerit di bawah lantai tetangganya. Saya bilang saya akan masuk lewat pintu itu atas dasar yang saya pegang dan dia boleh menonton. Platnya lepas dari kusen dengan dua kali tarikan obeng dapur.");
  }
  SND.sting();
  say("warn","Pintu bawah tanah bertahan","Digembok — dan dari sisi ini, yang merupakan sisi yang salah untuk sebuah bilik bawah tanah. Di bawah daun pintunya, catnya terkelupas dalam garis-garis pendek, dari arah dalam. Yang saya punya baru keterangan seorang nenek. Itu belum cukup untuk melepas pintu orang dari kusennya. Cari kuncinya, atau kumpulkan sesuatu yang tidak bisa disebut tebakan: minimal lima barang bukti kuat. Sekarang saya punya "+g+".");
  maybeLeave();
  render();
}

function goDown(line){
  S.down=true; S.room="cellar"; tick(2);
  SND.door();
  say("beat","Turun ke bawah tanah",line);
  say("cold","Bawah tanah","Dua meter tinggi langit-langit, tiga bilik di balik kawat ayam, satu bohlam di kabel. Bilik satu sepeda, bilik dua wallpaper orang. Bilik tiga punya pintu, dan pintunya punya gembok di sisi luar. Udaranya lebih hangat daripada seharusnya di bulan Oktober. Ada bau manusia yang sudah lama tidak dibiarkan mencuci.");
  if(!S.gone && S.nerve>=4) say("cold","Di atas","Dia tidak ikut turun. Papan lantai bergerak sekali, di dekat pintu depan, lalu tidak lagi. Dan di suatu tempat di ruangan ini, di balik desis, ada pengeras suara kecil yang membawa bunyi papan lantai itu sampai ke bawah sini.");
  render();
}

function openBay(){
  if(S.opened){ return S.named ? openReport() : openIdentify(); }
  if(!S.found.plat){
    SND.ui();
    say("beat","Pintu bilik","Sebelum saya menyentuhnya: platnya dulu. Benda seperti itu barang bukti, dan dia berhenti jadi barang bukti begitu berserakan di lantai.");
    return render();
  }
  S.opened=true; tick(2);
  SND.scream();
  say("warn","Bilik tiga","Gemboknya kuningan yang sama dengan kuncinya. Di dalam: kasur di atas palet, satu ember, botol air, tali jemuran disimpul ke kawat, dan seorang perempuan duduk bersandar ke bata dengan kedua pergelangan tangan di depan dan lakban yang sudah mengendur melintang di mulutnya. Akar rambutnya gelap, ujungnya diputihkan, empat pekan tidak ada apa-apa di wajahnya. Wajah itu wajah Stesya Varlamova. Sejauh yang bisa saya lihat di cahaya ini, itu persis wajah perempuan yang tadi membukakan pintu untuk saya.");
  say("say","Perempuan di dalam bilik","Begitu lakbannya lepas dia mengeluarkan satu kalimat sebelum batuknya datang: “Saya Stesya. Saya Stesya Varlamova, ini flat saya, dia di bawah sini sejak tanggal dua —” lalu dia tidak bisa bernapas cukup panjang untuk menyelesaikannya. Napasnya berbunyi tinggi di ujungnya, dan bahunya naik untuk membantu.");
  say("beat","Sekarang apa","Ambulans delapan menit lagi. Sebelum saya menyentuh siapa pun: biliknya masih bisa digeledah, dan dia masih bisa ditanya. Kalau sudah, tetapkan identitasnya.");
  render();
}

/* ---- identifikasi ---- */
function openIdentify(){
  const checks=[
    {id:"wrist",label:"Ambil pergelangan tangan kirinya dan lihat",
     need:S.read,
     needMsg:"Ada bekas luka di pergelangan tangan kirinya. Saya tidak tahu bekas luka itu seharusnya seperti apa — lampiran medis 7731-K masih belum dibaca, di saku mantel saya.",
     line:"Empat sentimeter di sisi dalam pergelangan tangan kiri, lama, dengan titik-titik bekas fiksator di kedua sisinya. Lampiran B 7731-K: radius distal, dipelat 2019, pennya dilepas 2020. Perempuan di dalam bilik punya itu. Perempuan di atas saya minta memperlihatkan pergelangan tangannya waktu saya masuk tadi, dan yang dia berikan punggung tangannya."},
    {id:"teeth",label:"Minta dia membuka mulutnya",
     need:S.read,
     needMsg:"Dia membuka mulutnya tanpa bertanya kenapa, yang entah kenapa justru lebih buruk. Tanpa lampiran medis itu, saya tidak tahu apa yang saya cari.",
     line:"Lampiran B: geraham kecil kiri atas, dipasang mahkota 2022. Ada mahkotanya, batas logamnya terasa di bawah kuku. Yang di atas tadi tertawa dua kali malam ini dengan mulut tertutup, dan sekarang saya tahu kenapa."},
    {id:"breath",label:"Dengarkan napasnya",
     need:!!S.found.inhaler,
     needMsg:"Napasnya berbunyi berat. Tanpa tahu apa yang ada di laci kamar tidur di atas, itu cuma berarti dia menghirup udara bawah tanah selama empat pekan.",
     line:"Bunyinya di embusan, tinggi, dengan bahu yang ikut naik — dan di laci kamar tidur di atas ada tiga inhaler yang ditebus tanggal 19 September, atas nama perempuan yang tadi bilang ke muka saya bahwa asmanya sudah sembuh."},
    {id:"mother",label:"Tanyakan nama ibunya",
     need:true,
     line:"“Irina Pavlovna. Meninggal bulan Maret, aktanya ada di tas itu —” Dia pasti tahu. Dan sekarang, yang di atas pun pasti tahu. Ini tidak menyelesaikan apa-apa, dan saya sudah tahu itu sebelum bertanya."}
  ];
  const done=Object.keys(S.checks).length;
  const body=document.createElement("div");
  body.innerHTML=`<span class="kicker">Identifikasi · bilik tiga · ${hhmm(S.clock)}</span>
    <h3>Dua perempuan dengan satu wajah</h3>
    <div class="rule"></div>
    <p>Mereka identik, dan salah satunya menghabiskan malam ini berbohong kepada saya dengan sangat lancar. Apa pun yang naik ke mobil nanti, naik atas nama saya. ${done?"":"Periksa dulu sebelum mengucapkan satu kata pun."}</p>
    <div class="opts" id="ck"></div>
    <div class="rule"></div>
    <p style="color:var(--dim)">Lalu tetapkan siapa perempuan di dalam bilik ini.</p>
    <div class="opts" id="nm"></div>`;
  const ck=body.querySelector("#ck");
  checks.forEach(c=>{
    const b=document.createElement("button");
    b.className="opt"+(S.checks[c.id]?" on":"");
    b.disabled=!!S.checks[c.id];
    b.innerHTML=`<span class="mark">${S.checks[c.id]?"✓":"•"}</span><span class="q">${c.label}<span class="tagline">${S.checks[c.id]?"sudah":"dua menit"}</span></span>`;
    b.onclick=()=>{
      S.checks[c.id]=true; tick(2);
      if(c.need) SND.find(); else SND.ui();
      say(c.need?"find":"beat","Periksa — "+c.label.toLowerCase(), c.need?c.line:c.needMsg);
      if((c.id==="wrist"||c.id==="teeth")&&c.need) S.checks.decisive=true;
      closeModal(); drawLog(); openIdentify();
    };
    ck.appendChild(b);
  });
  const nm=body.querySelector("#nm");
  [["stesya","Dia Stesya Varlamova, penghuni flat 3"],
   ["steffy","Dia saudaranya, Steffy. Yang di atas penghuninya"]].forEach(([v,label])=>{
    const b=document.createElement("button");
    b.className="opt"; b.innerHTML=`<span class="mark">▸</span><span class="q">${label}</span>`;
    b.onclick=()=>{ S.named=v; SND.page(); closeModal(); afterNaming(); };
    nm.appendChild(b);
  });
  modal(body,false);
}

function afterNaming(){
  if(S.named==="stesya"){
    say("beat","Ditetapkan","Saya tulis apa adanya: perempuan di bilik tiga adalah Stesya Varlamova, penghuni flat 3, dan perempuan yang membukakan pintu untuk saya bukan.");
  }else{
    say("warn","Ditetapkan","Saya tulis bahwa perempuan di dalam bilik adalah saudaranya dan yang di atas adalah penghuninya. Dia berhenti bicara waktu saya mengatakannya. Dia memandang saya agak lama, lalu berhenti bicara sama sekali, dan tidak bicara lagi sepanjang malam itu.");
    SND.sting();
  }
  if(S.gone){
    S.custody="gone";
    say("warn","Di atas sudah kosong","Pintu flat terbuka ke bordes dan lorongnya kosong. Mantel hilang dari gantungan, parka hilang. Lampu hijau di rak itu masih menyala.");
    render(); return setTimeout(openReport,30);
  }
  const body=document.createElement("div");
  body.innerHTML=`<span class="kicker">Keputusan · ${hhmm(S.clock)}</span>
    <h3>Siapa yang naik ke mobil?</h3>
    <div class="rule"></div>
    <p>Perempuan dari atas berdiri di ujung tangga bawah tanah dengan mantel di lengannya. Ambulans delapan menit lagi. Apa pun yang saya lakukan terhadap dua perempuan ini sekarang, saya melakukannya sendirian, di ruang bawah tanah, tanpa surat perintah dan dengan satu set borgol.</p>
    <div class="opts" id="cu"></div>`;
  const cu=body.querySelector("#cu");
  [["both","Dua-duanya: satu ditahan, satu ke rumah sakit dikawal petugas","jawaban yang hati-hati"],
   ["upstairs","Tahan yang dari atas; yang satu lagi tunggu paramedis","cepat, dan dia sendirian di bawah tanah"],
   ["cage","Tahan perempuan yang dari dalam bilik","dia yang tadi diikat"]].forEach(([v,label,tag])=>{
    const b=document.createElement("button");
    b.className="opt"; b.innerHTML=`<span class="mark">▸</span><span class="q">${label}<span class="tagline">${tag}</span></span>`;
    b.onclick=()=>{ S.custody=v; SND.page(); closeModal(); custodyLog(); };
    cu.appendChild(b);
  });
  modal(body,false);
}

function custodyLog(){
  if(S.custody==="both"){
    say("beat","Penahanan","Borgol untuk perempuan dari atas, dibacakan haknya pukul 23 lewat di sebuah ruang bawah tanah, yang pasti akan dikomentari inspektur piket. Yang satu lagi naik tangga berbalut mantel saya, didampingi Brigadir Weiss, dan tidak lepas dari pandangan siapa pun antara sini dan rumah sakit — karena malam ini saya tidak bisa bersumpah atas sebuah wajah.");
  }else if(S.custody==="upstairs"){
    say("beat","Penahanan","Borgol untuk perempuan dari atas. Yang satu lagi saya tinggal duduk di palet menunggu paramedis: delapan menit di mana tidak ada yang mengawasi siapa pun.");
  }else{
    say("warn","Penahanan","Borgol untuk perempuan dari dalam bilik. Dia tidak melawan sama sekali. Yang satu lagi berdiri di ujung tangga dengan mantel di lengannya dan berkata, pelan, bahwa dia akan merebus air dulu untuk bapak-bapak petugas.");
    SND.sting();
  }
  render();
  setTimeout(openReport,30);
}

/* ============================================================ modal */

function modal(node,dismissable){
  closeModal();
  const scrim=document.createElement("div");
  scrim.className="scrim";
  const sheet=document.createElement("div");
  sheet.className="sheet"+(node.dataset&&node.dataset.file?" file":"");
  if(dismissable!==false){
    const x=document.createElement("button");
    x.className="close"; x.textContent="TUTUP"; x.onclick=closeModal;
    sheet.appendChild(x);
  }
  sheet.appendChild(node);
  scrim.appendChild(sheet);
  if(dismissable!==false) scrim.addEventListener("click",e=>{ if(e.target===scrim) closeModal(); });
  host.appendChild(scrim);
}
function closeModal(){ host.innerHTML=""; }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

function openTalk(){
  if(S.gone) return;
  SND.page();
  const d=document.createElement("div");
  d.innerHTML=`<span class="kicker">Keterangannya sendiri · ${ROOM_LABEL[S.room].toLowerCase()} · ${hhmm(S.clock)}</span>
    <h3>Perempuan di flat 3</h3>
    <div class="rule"></div>
    <p style="color:var(--dim)">Dia menjawab semuanya, dan itu sendiri tidak biasa. Pertanyaan tanpa apa-apa di belakangnya akan dijawab rapi dan tidak merugikan siapa pun. Desak hanya kalau ada barang bukti yang bisa ditaruh di atas meja.</p>
    <div class="opts" id="ql"></div>
    ${S.nerve>=5?'<p style="color:var(--red);font-size:13.5px;margin-top:14px">Dua kali dia sudah meminta saya keluar. Sekali lagi diperas, dia akan lewat pintu itu.</p>':""}`;
  const ql=d.querySelector("#ql");
  QS.forEach(q=>{
    if(q.needs && !S.found[q.needs]) return;
    const asked=!!S.asked[q.id], pressed=!!S.pressed[q.id];
    const b=document.createElement("button");
    b.className="opt"+(asked?" on":"");
    b.innerHTML=`<span class="mark">${asked?"✓":"•"}</span><span class="q">${q.ask}<span class="tagline">${asked?"sudah ditanya":"tiga menit"}</span></span>`;
    b.disabled=asked;
    b.onclick=()=>{ S.asked[q.id]=true; tick(3); SND.ui(); say("say","Katanya",q.say); closeModal(); drawLog(); openTalk(); };
    ql.appendChild(b);
    if(asked && q.press && !pressed){
      const need=q.press.needs;
      const have = q.anyOf ? need.some(n=>S.found[n]) : need.every(n=>S.found[n]);
      const p=document.createElement("button");
      p.className="opt press";
      if(have){
        p.innerHTML=`<span class="mark">▸</span><span class="q">Desak: taruh di depannya<span class="tagline">${need.filter(n=>S.found[n]).map(n=>CLUES[n].name).join(" · ")}</span></span>`;
        p.onclick=()=>{
          S.pressed[q.id]=true; tick(2);
          SND.sting();
          say("say","Didesak",q.press.line);
          find(q.press.gives);
          nerveUp(q.press.nerve||1);
          closeModal(); drawLog();
          if(S.nerve>=6){ render(); } else openTalk();
        };
      }else{
        p.disabled=true;
        p.innerHTML=`<span class="mark">·</span><span class="q">Belum ada yang bisa dipakai mendesak<span class="tagline">butuh ${q.anyOf?"salah satu":"keduanya"}: ${need.map(n=>CLUES[n].name).join(" · ")}</span></span>`;
      }
      ql.appendChild(p);
    }
  });
  modal(d);
}

function openReport(){
  SND.page();
  const d=document.createElement("div");
  d.innerHTML=`<span class="kicker">Laporan · perkara 7731-K · ${hhmm(S.clock)}</span>
    <h3>Yang naik ke sersan penjaga</h3><div class="rule"></div>
    <p>Tiga barang bukti memimpin berkas. Pilih tiga yang berdiri sendiri tanpa saya harus menjelaskan apa pun di kursi saksi.</p>
    <div class="opts" id="ex"></div>
    <div class="rule"></div>
    <p style="color:var(--dim)">Dan pasalnya.</p>
    <div class="opts" id="ch"></div>
    <button class="bigbtn" id="file" disabled>Ajukan</button>`;
  const ex=d.querySelector("#ex");
  const ids=Object.keys(S.found);
  if(!ids.length) ex.innerHTML=`<p class="empty">Semalaman tidak ada yang Anda tulis.</p>`;
  ids.forEach(id=>{
    const c=CLUES[id];
    const b=document.createElement("button");
    b.className="opt"+(S.picks.includes(id)?" on":"");
    b.innerHTML=`<span class="mark">${S.picks.includes(id)?"✓":"▫"}</span><span class="q">${c.name}<span class="tagline">${ROOM_LABEL[c.at]} · ${c.w===3?"kuat":c.w===2?"pendukung":"lemah"}</span></span>`;
    b.onclick=()=>{
      const i=S.picks.indexOf(id);
      if(i>=0) S.picks.splice(i,1);
      else if(S.picks.length<3) S.picks.push(id);
      SND.ui(); closeModal(); openReport();
    };
    ex.appendChild(b);
  });
  const ch=d.querySelector("#ch");
  [["full","Perampasan kemerdekaan, dan penipuan dengan identitas palsu","dua tindak pidana, sebulan lamanya"],
   ["assault","Penganiayaan ringan, dan lihat besok bagaimana","terlalu ringan"],
   ["none","Tidak ada tindak pidana — urusan keluarga, limpahkan ke dinas sosial","pilihan yang tenang"],
   ["victim","Keterangan palsu, terhadap perempuan di dalam bilik","salah ujung sama sekali"]].forEach(([v,label,tag])=>{
    const b=document.createElement("button");
    b.className="opt"+(S.charge===v?" on":"");
    b.innerHTML=`<span class="mark">${S.charge===v?"✓":"▫"}</span><span class="q">${label}<span class="tagline">${tag}</span></span>`;
    b.onclick=()=>{ S.charge=v; SND.ui(); closeModal(); openReport(); };
    ch.appendChild(b);
  });
  const f=d.querySelector("#file");
  f.disabled = !(S.charge && (S.picks.length===3 || ids.length<3));
  f.onclick=()=>{ closeModal(); grade(); openEnding(); };
  modal(d,false);
}

function grade(){
  const weight=S.picks.reduce((a,id)=>a+CLUES[id].w,0);
  const idOK = S.named==="stesya";
  const chargeOK = S.charge==="full";
  if(!idOK){ S.grade="wrong"; }
  else if(!chargeOK){ S.grade=(S.charge==="victim")?"wrong":"released"; }
  else if(S.custody==="gone"){ S.grade="atlarge"; }
  else if(S.custody==="cage"){ S.grade="wrong"; }
  else if(weight>=8 && S.custody==="both"){ S.grade="complete"; }
  else { S.grade="charged"; }
  S.weight=weight;
}

    released:{cls:"bad",t:"PERKARA DIHENTIKAN",
      p:["Seorang perempuan menghabiskan tiga puluh satu hari di atas palet, di balik gembok yang dipasang dari sisi luar, dan berkas yang saya tulis menyebut itu urusan keluarga. Inspektur piket mengembalikannya dua kali. Waktu berkas itu kembali untuk ketiga kalinya, tersangkanya sudah beralamat di distrik lain dan punya pengacara, dan lakban serta tali jemuran itu sudah ada di bak sampah belakang gedung.",
