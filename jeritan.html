<title>Jeritan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Tata letak: map perkara terbuka di atas meja - pelat ruangan di kiri,
   kolom berkas berjalan di kanan, menumpuk jadi satu kolom di layar sempit. */
:root{
  --ink:#08090b;
  --panel:#111419;
  --panel2:#171c22;
  --raise:#1f262e;
  --line:#2e3942;
  --edge:#475764;
  --fg:#dbe1e6;
  --dim:#7f8d99;
  --faint:#55626d;
  --manila:#cdb98c;
  --manila-ink:#241e14;
  --amber:#d8933a;
  --red:#b5332d;
  --sick:#7d8f63;
  --wall:#141a20;
  --floor:#0e141a;
  --obj:#1e2830;
  --obj2:#27333c;
  --font-display:"Special Elite","Courier New",ui-monospace,monospace;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-data:"IBM Plex Mono","Consolas",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--fg);
  font-family:var(--font-body);font-size:15px;line-height:1.55;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
#app{display:flex;flex-direction:column;min-height:100%}

/* ---- bilah atas ---- */
.bar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;
  padding-block:9px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.badge{
  font-family:var(--font-display);font-size:13px;letter-spacing:.06em;
  color:var(--amber);border:1px solid var(--line);border-radius:2px;
  padding:2px 8px;white-space:nowrap;
}
.bar .meta{font-family:var(--font-data);font-size:12px;color:var(--dim);white-space:nowrap}
.bar .meta b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.nerve{display:flex;align-items:center;gap:6px;font-family:var(--font-data);font-size:11px;letter-spacing:.08em;color:var(--dim)}
.pips{display:flex;gap:3px}
.pip{width:9px;height:14px;border:1px solid var(--line);background:transparent}
.pip.on{background:var(--red);border-color:var(--red)}
@media (prefers-reduced-motion:no-preference){ .pip.on:last-of-type{animation:thump 1.1s ease-in-out infinite} }
@keyframes thump{0%,100%{opacity:1}50%{opacity:.45}}
.bar .spacer{flex:1 1 20px}
.tool{
  background:var(--panel2);border:1px solid var(--line);border-radius:2px;
  padding:5px 11px;cursor:pointer;font-size:13px;letter-spacing:.02em;
}
.tool:hover{background:var(--raise);border-color:var(--faint)}
.tool:focus-visible,.hs:focus-visible,.opt:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.tool .n{color:var(--amber);font-family:var(--font-data);font-size:12px}
.tool.snd{min-width:92px}

/* ---- utama ---- */
main{
  flex:1 1 auto;display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:22px;
  width:100%;max-width:1320px;margin:0 auto;padding-block:22px 34px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:18px}}
main.solo{display:block}

.scene{min-width:0;display:flex;flex-direction:column;gap:12px}
.roomhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.roomhead h2{font-family:var(--font-display);font-size:23px;letter-spacing:.02em}
.roomhead .sub{font-family:var(--font-data);font-size:12px;color:var(--faint)}

.plate{
  position:relative;border:1px solid var(--line);background:var(--wall);
  aspect-ratio:800/450;width:100%;max-width:100%;overflow:hidden;
}
.plate svg{display:block;width:100%;height:100%}
.plate.dark::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 38%,rgba(0,0,0,0) 38%,rgba(0,0,0,.58) 100%);
}
.hs{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;align-items:center;gap:7px;
  background:rgba(8,9,11,.8);border:1px solid var(--faint);border-radius:2px;
  padding:3px 8px 3px 5px;cursor:pointer;
  font-family:var(--font-data);font-size:11.5px;letter-spacing:.02em;
  color:var(--fg);backdrop-filter:blur(2px);white-space:nowrap;z-index:2;
}
.hs .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none;box-shadow:0 0 0 3px rgba(216,147,58,.18)}
.hs:hover{border-color:var(--amber);background:rgba(8,9,11,.96)}
.hs.done{color:var(--faint);border-color:#242d35;cursor:default}
.hs.done .dot{background:#242d35;box-shadow:none}
.hs.act .dot{background:var(--red);box-shadow:0 0 0 3px rgba(181,51,45,.22)}
@media (prefers-reduced-motion:no-preference){
  .hs:not(.done) .dot{animation:tick 2.4s ease-in-out infinite}
  @keyframes tick{0%,100%{box-shadow:0 0 0 2px rgba(216,147,58,.16)}50%{box-shadow:0 0 0 6px rgba(216,147,58,.05)}}
}
.moves{display:flex;flex-wrap:wrap;gap:8px}
.moves .lbl{font-family:var(--font-data);font-size:11px;letter-spacing:.1em;color:var(--faint);align-self:center;margin-right:2px}

/* ---- kolom berkas ---- */
.side{min-width:0;display:flex;flex-direction:column;gap:12px}
.log{
  border:1px solid var(--line);background:var(--panel);
  padding:14px 15px;display:flex;flex-direction:column;gap:14px;
  flex:1 1 auto;min-height:340px;max-height:74vh;overflow-y:auto;
}
@media (max-width:900px){.log{min-height:0;max-height:58vh}}
.entry{border-left:2px solid var(--line);padding-left:11px}
.entry .h{font-family:var(--font-data);font-size:10.5px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
.entry p{margin:3px 0 0}
.entry.find{border-left-color:var(--amber)}
.entry.find .h{color:var(--amber)}
.entry.say{border-left-color:var(--faint)}
.entry.say p{color:#ccd4db;font-style:italic}
.entry.warn{border-left-color:var(--red)}
.entry.warn .h{color:var(--red)}
.entry.cold{border-left-color:var(--sick)}
.entry.cold .h{color:var(--sick)}
.entry.cold p{color:#b9c4c2}
.entry.beat p{color:var(--dim)}

/* ---- modal ---- */
.scrim{
  position:fixed;inset:0;z-index:40;background:rgba(4,5,7,.86);
  display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:clamp(14px,5vh,54px) max(16px,env(safe-area-inset-left,0px)) 54px;
}
.sheet{
  width:100%;max-width:720px;background:var(--panel);
  border:1px solid var(--line);border-top:3px solid var(--amber);
  padding:20px 22px 24px;
}
.sheet.file{background:var(--manila);color:var(--manila-ink);border-top-color:#7d6836}
.sheet h3{font-family:var(--font-display);font-size:20px;margin-bottom:4px}
.sheet .kicker{font-family:var(--font-data);font-size:11px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.sheet.file .kicker{color:#63542f}
.sheet .rule{height:1px;background:var(--line);margin:14px 0}
.sheet.file .rule{background:#a8956a}
.close{position:sticky;top:0;float:right;background:none;border:1px solid var(--line);padding:2px 9px;cursor:pointer;font-family:var(--font-data);font-size:12px}
.sheet.file .close{border-color:#7d6836;color:var(--manila-ink)}

.fields{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:0}
.fields dt{font-family:var(--font-data);font-size:11px;letter-spacing:.08em;color:#63542f;text-transform:uppercase;padding-top:3px}
.fields dd{margin:0}
.annex{border:1px dashed #7d6836;padding:11px 13px;margin-top:14px;background:rgba(255,255,255,.2)}
.annex h4{margin:0 0 5px;font-family:var(--font-data);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.stamp{
  display:inline-block;transform:rotate(-4deg);border:2px solid var(--red);color:var(--red);
  font-family:var(--font-display);font-size:14px;letter-spacing:.08em;padding:3px 10px;margin-top:16px;opacity:.85;
}

.opts{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.opt{
  text-align:left;background:var(--panel2);border:1px solid var(--line);
  padding:10px 13px;cursor:pointer;display:flex;gap:11px;align-items:flex-start;
}
.opt:hover:not(:disabled){background:var(--raise);border-color:var(--faint)}
.opt:disabled{opacity:.42;cursor:default}
.opt .q{flex:1 1 auto;min-width:0}
.opt .tagline{font-family:var(--font-data);font-size:10.5px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase;display:block;margin-top:3px}
.opt.press{border-color:var(--red);background:rgba(181,51,45,.1)}
.opt.press .tagline{color:var(--red)}
.opt.on{border-color:var(--amber);background:rgba(216,147,58,.12)}
.opt .mark{font-family:var(--font-data);color:var(--faint);flex:none}
.opt.on .mark{color:var(--amber)}

.group{margin-top:16px}
.group>h4{font-family:var(--font-data);font-size:11px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;margin:0 0 7px}
.ex{border:1px solid var(--line);padding:9px 12px;margin-bottom:7px;background:var(--panel2)}
.ex .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex .t b{font-weight:600;font-size:14px}
.ex .w{font-family:var(--font-data);font-size:10px;letter-spacing:.1em;color:var(--faint);white-space:nowrap}
.ex .w.s3{color:var(--amber)}
.ex p{margin:5px 0 0;font-size:13.5px;color:#c0c9d1}
.empty{color:var(--dim);font-style:italic}

.bigbtn{
  display:block;width:100%;margin-top:18px;background:var(--amber);color:#17120a;
  border:none;padding:12px;cursor:pointer;font-family:var(--font-display);
  font-size:15px;letter-spacing:.06em;
}
.bigbtn:hover{filter:brightness(1.08)}
.bigbtn:disabled{background:var(--panel2);color:var(--faint);cursor:default;filter:none}
.ghost{background:none;border:1px solid var(--line);color:var(--fg)}
.ghost:hover{background:var(--panel2);filter:none}

.title{
  max-width:680px;margin:0 auto;padding-block:clamp(26px,9vh,80px) 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.title .no{font-family:var(--font-data);font-size:12px;letter-spacing:.2em;color:var(--amber)}
.title h1{font-family:var(--font-display);font-size:clamp(34px,8vw,52px);line-height:1.04;margin:10px 0 14px}
.title .lede{font-size:16px;color:#c4ced6;max-width:60ch}
.title .call{
  border:1px solid var(--line);border-left:3px solid var(--red);background:var(--panel);
  padding:13px 16px;margin:22px 0;font-family:var(--font-data);font-size:13px;color:#c4ced6;
}
.title .call b{color:var(--fg)}
.cred{margin-top:26px;font-size:12.5px;color:var(--faint);font-family:var(--font-data)}

.verdict{font-family:var(--font-display);font-size:clamp(24px,5vw,34px);line-height:1.1;margin:6px 0 2px}
.verdict.good{color:var(--amber)}
.verdict.bad{color:var(--red)}
.scoreline{display:flex;flex-wrap:wrap;gap:6px 20px;font-family:var(--font-data);font-size:12px;color:var(--dim);margin-top:10px}
.scoreline b{color:var(--fg);font-variant-numeric:tabular-nums}
.truth{border:1px solid var(--line);background:var(--panel2);padding:14px 16px;margin-top:18px}
.truth h4{font-family:var(--font-data);font-size:11px;letter-spacing:.12em;color:var(--amber);text-transform:uppercase;margin:0 0 7px}
.truth p{margin:0 0 9px}
.truth p:last-child{margin:0}
</style>

<div id="app">
  <header class="bar" id="bar" hidden>
    <span class="badge">PERKARA 7731-K</span>
    <span class="meta">Lindenweg 14, flat 3 &nbsp;·&nbsp; <b id="clock">21:40</b></span>
    <span class="nerve">KEGELISAHANNYA<span class="pips" id="pips"></span></span>
    <span class="spacer"></span>
    <button class="tool snd" id="btnSnd">Suara: nyala</button>
    <button class="tool" id="btnFile">Berkas perkara</button>
    <button class="tool" id="btnBook">Catatan <span class="n" id="bookN">0</span></button>
  </header>
  <main id="main"></main>
</div>

<script>
"use strict";

/* ============================================================ suara
   Semua bunyi dibangkitkan di dalam kode: dengung ruangan, detak,
   desah monitor, derit pintu. Tidak ada berkas audio dari luar. */
const SND=(()=>{
  let ac=null,master=null,drone=false,heart=null,amb=null,muted=false,lastN=-1;
  try{ muted = localStorage.getItem("lw_mute")==="1"; }catch(e){}
  function ctx(){
    if(ac) return ac;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return null;
      ac=new AC();
      master=ac.createGain();
      master.gain.value=muted?0:0.5;
      master.connect(ac.destination);
    }catch(e){ ac=null; }
    return ac;
  }
  function tone(f,dur,type,vol,to){
    const c=ctx(); if(!c) return;
    try{
      const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
      o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
      if(to) o.frequency.exponentialRampToValueAtTime(Math.max(20,to),t+dur);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol||0.2,t+Math.min(0.08,dur/3));
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.06);
    }catch(e){}
  }
  function hiss(dur,f,q,vol,fade){
    const c=ctx(); if(!c) return;
    try{
      const len=Math.max(1,Math.floor(c.sampleRate*dur));
      const buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<len;i++){ const k=i/len; d[i]=(Math.random()*2-1)*(fade?Math.sin(Math.PI*k):(1-k)); }
      const n=c.createBufferSource(); n.buffer=buf;
      const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=f||1200; bp.Q.value=q||1;
      const g=c.createGain(); g.gain.value=vol||0.12;
      n.connect(bp); bp.connect(g); g.connect(master); n.start();
    }catch(e){}
  }
  function startDrone(){
    const c=ctx(); if(!c||drone) return; drone=true;
    try{
      const g=c.createGain(); g.gain.setValueAtTime(0.0001,c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.5,c.currentTime+8);
      g.connect(master);
      const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=170; lp.Q.value=4; lp.connect(g);
      [[48.5,"sawtooth",0.5],[49.1,"sawtooth",0.4],[72.8,"triangle",0.22]].forEach(([f,t,v])=>{
        const o=c.createOscillator(); o.type=t; o.frequency.value=f;
        const og=c.createGain(); og.gain.value=v;
        o.connect(og); og.connect(lp); o.start();
      });
      const lfo=c.createOscillator(); lfo.frequency.value=0.06;
      const lg=c.createGain(); lg.gain.value=55;
      lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
      amb=setInterval(()=>{
        const r=Math.random();
        if(r<0.34) hiss(2.2,320+Math.random()*260,7,0.03,true);        /* pipa */
        else if(r<0.6) tone(1180+Math.random()*500,2.4,"sine",0.012);  /* dering telinga */
        else if(r<0.78) tone(41,1.6,"sine",0.1);                       /* sesuatu di bawah */
        else hiss(0.5,140,3,0.035,true);                               /* lantai */
      },11000);
    }catch(e){}
  }
  function beat(){ tone(54,0.26,"sine",0.34); setTimeout(()=>tone(47,0.2,"sine",0.2),165); }
  return {
    boot(){ const c=ctx(); if(c&&c.state==="suspended"){ try{c.resume();}catch(e){} } startDrone(); },
    ui(){ hiss(0.035,2400,2,0.05); },
    find(){ hiss(0.05,900,2,0.06); tone(168,0.16,"triangle",0.1); },
    page(){ hiss(0.12,1700,1.5,0.045); },
    sting(){ tone(233,0.9,"sawtooth",0.055); tone(220,0.9,"sawtooth",0.05); hiss(0.3,2600,6,0.03,true); },
    door(){ tone(132,1.5,"sawtooth",0.045,58); hiss(1.4,420,9,0.05,true); },
    breath(){ hiss(1.5,520,6,0.085,true); setTimeout(()=>hiss(1.1,380,7,0.06,true),1750); },
    scream(){
      tone(760,1.1,"sawtooth",0.1,170); tone(1150,0.9,"square",0.03,240);
      hiss(1.2,1500,2,0.09,true); setTimeout(()=>tone(44,2.4,"sine",0.16),700);
    },
    knock(){ tone(120,0.1,"triangle",0.22); setTimeout(()=>tone(110,0.1,"triangle",0.2),230); setTimeout(()=>tone(104,0.12,"triangle",0.18),470); },
    heart(n){
      if(n===lastN) return; lastN=n;
      if(heart){ clearInterval(heart); heart=null; }
      if(n<0||!ctx()) return;
      const ms=Math.max(560,1500-n*150);
      beat(); heart=setInterval(beat,ms);
    },
    stop(){ if(heart){clearInterval(heart);heart=null;} lastN=-1; },
    muted(){ return muted; },
    toggle(){
      muted=!muted;
      try{ localStorage.setItem("lw_mute",muted?"1":"0"); }catch(e){}
      if(master){ try{ master.gain.setTargetAtTime(muted?0:0.5,ac.currentTime,0.08); }catch(e){} }
      return muted;
    }
  };
})();

/* ============================================================ data */

const CLUES = {
  /* bordes ------------------------------------------------------------- */
  jeritan:{at:"doorstep",w:2,name:"Jeritan dari bawah lantai",
    text:"Bu Brauer, flat 2, empat puluh satu tahun di gedung ini: “Jeritan. Kamis malam, dan tadi malam lagi. Bukan kata-kata — perempuan, terus-menerus, lalu berhenti sekaligus, dan yang berhenti sekaligus itu justru yang bikin saya tidak bisa tidur. Dan bukan dari flatnya. Dari bawah lantai saya.”"},
  asing:{at:"doorstep",w:1,name:"Orang asing di tangga",
    text:"“Senin saya menyapanya di bordes dan dia menatap tembus saya seperti saya kaca jendela. Rambutnya lebih gelap. Lebih tinggi karena sepatunya. Enam tahun saya kenal anak itu, Pak, dan Senin itu saya mengucapkan selamat malam kepada orang asing.”"},
  tamu:{at:"doorstep",w:2,name:"Perempuan dengan tas besar",
    text:"“Dua pekan lalu ada perempuan naik tangga bawa tas jinjing besar, larut sekali, pakai parka. Saya pikir Stesya habis pergi dan pulang. Saya lihat dari lubang pintu: dia berdiri di depan pintu flat 3 lama sekali sebelum masuk. Seperti orang yang mau yakin dulu rumahnya kosong.”"},

  /* lorong depan -------------------------------------------------------- */
  kait:{at:"hall",w:2,name:"Kait yang kosong",
    text:"Empat kait di dekat pintu, dilabeli spidol dengan tulisan tangan rapi: FLAT · SEPEDA · POS · BAWAH TANAH. Tiga kunci tergantung. Kait bawah tanah kosong, dan kaitnya sendiri bersih — dipegang berkali-kali belakangan ini."},
  monitor:{at:"hall",w:3,name:"Penerima monitor bayi",nerve:1,
    text:"Di rak lorong, penerima monitor bayi model lama. Lampunya hijau: menyala, dan masih berpasangan dengan pemancarnya di suatu tempat. Volumenya hampir nol. Saya berdiri diam di depannya sampai saya bisa menghitungnya, dan di balik desis itu ada napas. Bukan napas saya, dan bukan napas dia, karena dia sedang bicara di belakang saya waktu saya menghitungnya."},
  parka:{at:"hall",w:3,name:"Label binatu di parka",
    text:"Di gantungan, sebuah parka yang dua ukuran terlalu besar untuk siapa pun yang tinggal di sini. Dijahit di dalam kerahnya, label binatu lembaga: BIRCHFIELD RESIDENTIAL CARE · 41."},

  /* ruang tamu ---------------------------------------------------------- */
  foto:{at:"living",w:3,name:"Dua anak di dalam foto",
    text:"Foto keluarga di rak: seorang ibu dan dua anak perempuan umur sembilan atau sepuluh tahun dengan satu wajah di antara mereka. Seseorang menekan anak yang kanan keluar dari bingkainya; kacanya retak persis di kepalanya. Di baliknya, dengan pensil: “Stesya & Stef—, Kirov, 2004”."},
  surat:{at:"living",w:3,name:"Surat keterangan keluar",
    text:"Tiga pekan surat, semuanya sudah dibuka. Di antara tagihan, satu amplop berjendela dari Birchfield Residential Care: surat keterangan keluar tertanggal 2 Oktober, atas nama STEFFY VARLAMOVA, ke alamat yang bukan alamat ini, diteruskan dua kali sampai ke flat ini."},
  jam:{at:"living",w:2,name:"Jam di pergelangan yang salah",
    text:"Terselip di sela bantalan sofa, jam tangan perempuan, berhenti di pukul empat lewat dua puluh. Talinya aus di lubang keenam dan gespernya menggigit kulit di sisi kanan — jam yang dipakai di lengan kanan. Di setiap foto di ruangan ini, Stesya memakainya di kiri."},
  radio:{at:"living",w:2,name:"Radio di angka sembilan",
    text:"Radio dapur dipindahkan ke ambang jendela, volume di angka sembilan, frekuensinya di antara dua stasiun. Tidak ada apa-apa selain desis. Ada persegi bersih di debu rak tempatnya dulu berdiri. Ambang jendela ini menempel pada dinding yang membelakangi tangga — dan tangga itu turun ke bawah tanah."},

  /* dapur --------------------------------------------------------------- */
  nampan:{at:"kitchen",w:3,name:"Makan malam yang kedua",nerve:1,
    text:"Nampan logam di meja dapur: mangkuk plastik, roti dilipat dua, satu sendok. Tidak ada pisau, tidak ada garpu. Supnya sudah dingin sampai berkulit. Ada dua bekas lingkaran kering di nampannya, tempat mangkuk itu pernah berdiri sebelumnya — nampan yang turun ke suatu tempat lalu naik lagi, dua kali sehari, kira-kira sebulan."},
  kunci:{at:"kitchen",w:2,name:"Kunci kuningan, dilakban",
    text:"Sekat sendok bisa diangkat dari lacinya. Dilakban di bawahnya, satu kunci gembok kuningan kecil, mengilap di bahunya karena sebulan ini terlalu sering diputar."},
  tulisan:{at:"kitchen",w:2,name:"Dua tangan di pintu kulkas",
    text:"Daftar belanja di bawah magnet, ditulis oleh tangan yang miring keras ke kanan. Di belakangnya, daftar bulan Agustus dengan pulpen biru yang sama: miring ke kiri, hurufnya lebih sempit, angka tujuhnya dicoret. Pulpen yang sama. Bukan orang yang sama."},
  obat:{at:"kitchen",w:3,name:"Bungkus obat di tempat sampah",
    text:"Didorong ke bawah kantong sampah: sebelas bungkus kosong obat penenang, label apoteknya digunting habis kecuali dua huruf terakhir sebuah nama. Selebarannya terlipat terbuka di bagian dosis untuk orang dewasa, dan ada satu baris yang ditandai kuku."},

  /* kamar mandi --------------------------------------------------------- */
  pewarna:{at:"bath",w:2,name:"Ash Walnut No. 4",
    text:"Di tempat sampah, kardus pewarna rambut — Ash Walnut No. 4 — dan sepasang sarung tangan lateks yang terbalik. Itu warna asli Stesya, dari kotak, dibeli tanggal 3. Seseorang mewarnai rambutnya menuju warna ini, bukan menjauh darinya."},
  lensa:{at:"bath",w:3,name:"Lensa cokelat tanpa ukuran",
    text:"Tempat lensa kontak di lemari, kedua cekungannya basah, cairannya dibuka bulan ini. Lensanya berwarna cokelat rata — cokelat pasfoto. Kartu optik Stesya ada di lemari yang sama: tidak ada koreksi, kedua mata. Di tepi mata kiri perempuan itu ada cincin kelabu, tempat lensanya menumpang sedikit di luar iris."},
  cermin:{at:"bath",w:2,name:"Cermin yang ditutup",nerve:1,
    text:"Cermin kamar mandi ditutup handuk, dijepit di dua sudut raknya. Di balik handuk, di sisa embun yang mengering, ada bekas telapak tangan setinggi wajah dan satu kata yang digores ujung jari, hampir hilang: AKU. Tulisannya terbalik. Ditulis dari sisi yang sama dengan saya, oleh orang yang berdiri sangat dekat dengan kaca, sangat lama."},

  /* kamar tidur --------------------------------------------------------- */
  buku:{at:"bed",w:2,name:"Tangan yang menyalin",nerve:1,
    text:"Buku harian, diisi tiap hari sampai 28 September. Lalu satu halaman disobek dekat jahitannya. Lalu tiga entri dengan tangan yang memang tangannya: lengkungannya benar, tekanannya salah, dan tidak ada ketergesaan di mana pun. Tiga entri itu menceritakan hari-hari yang menyenangkan. Di bawah lantai halaman terakhir ada bekas pensil dari halaman yang hilang, terbaca terbalik: “dia tahu di mana kuncinya”."},
  ponsel:{at:"bed",w:2,name:"Ponselnya, masih mengisi daya",
    text:"Ponsel Stesya di pengisi daya samping tempat tidur — benda yang tidak ditinggalkan siapa pun kalau pergi sebulan. Pesan ke seseorang bernama Dmitri turun dari empat kali sehari jadi dua baris formal pada 1 Oktober, tanpa nama di akhir. Satu panggilan ditolak pukul 11:04 tanggal 29 September: BIRCHFIELD."},
  tas:{at:"bed",w:3,name:"Tas berisi hidup orang lain",nerve:1,
    text:"Tas jinjing besar di bawah baju-baju gantungan, terisi penuh dan diresleting: paspor Stesya, kartu-kartu banknya, akta lahirnya, buku sewanya, akta kematian ibunya. Dokumen sebuah hidup, dikumpulkan jadi satu tas oleh orang yang tidak menjalani hidup itu."},
  inhaler:{at:"bed",w:3,name:"Inhaler di dalam laci",nerve:1,
    text:"Di laci samping tempat tidur, satu inhaler pereda biru terisi tiga perempat dan dua cadangan yang masih di kotaknya. Stesya Varlamova asma sejak umur enam tahun. Dia tidak keluar dari gedung ini sambil meninggalkan semua ini."},

  /* keterangannya ------------------------------------------------------- */
  t_cerita:{at:"talk",w:2,name:"Jeritan itu berubah jadi pipa",
    text:"Didesak soal radio, keterangannya berubah dalam sepuluh detik: suara itu radio, lalu pipa, lalu “gedung ini memang menghantar suara”. Orang mengulang keterangan yang benar. Keterangan yang disusun, direvisi."},
  t_saudara:{at:"talk",w:3,name:"“Saya anak tunggal”",
    text:"Ditanya apakah punya saudara perempuan, dia menjawab tanpa jeda sama sekali: “Saya anak tunggal.” Ditunjukkan fotonya, katanya anak yang satu lagi sepupunya, dan sepupunya sudah meninggal. Birchfield memulangkan seorang Steffy Varlamova pada tanggal 2, ke alamat yang bukan alamat ini."},
  t_nampan:{at:"talk",w:2,name:"“Itu buat nanti malam”",
    text:"Nampan kedua, katanya, buat dia sendiri nanti malam. Supnya sudah berkulit sejak sebelum saya datang, dan ada dua bekas lingkaran lama di logamnya. Waktu saya tanya kenapa tidak ada pisau dan garpunya, dia diam empat detik penuh lalu bilang dia sedang hemat cucian."},
  t_monitor:{at:"talk",w:3,name:"“Itu rusak, peninggalan penyewa lama”",
    text:"Monitor itu, katanya, rusak, ditinggal penyewa sebelumnya. Lampunya hijau. Alat itu berpasangan, dan pasangan itu ada di suatu tempat di gedung ini, menyala. Waktu saya bilang begitu, dia melihat ke lantai — bukan ke alatnya, ke lantai — dan bilang dia akan membuangnya besok."},
  t_bawah:{at:"talk",w:2,name:"“Bawah tanah itu punya pemilik gedung”",
    text:"Katanya bilik bawah tanah itu milik pemilik gedung dan dia tidak pernah punya kuncinya. Di lorong depannya sendiri ada kait berlabel BAWAH TANAH dengan spidolnya sendiri, dan tidak ada apa-apa di situ."},
  t_rupa:{at:"talk",w:1,name:"“Ini untuk silau”",
    text:"Soal lensanya: katanya untuk silau. Lensa itu tidak punya koreksi sama sekali, dan tangannya naik ke mata kirinya waktu mengatakannya."},
  t_inhaler:{at:"talk",w:2,name:"“Saya sudah sembuh lama”",
    text:"Soal inhaler: katanya asmanya hilang bertahun-tahun lalu. Perempuan dewasa dengan dua puluh tiga tahun asma tidak sembuh dalam dua pekan sejak resep terakhirnya ditebus."},

  /* bawah tanah --------------------------------------------------------- */
  plat:{at:"cellar",w:3,name:"Plat gembok dipasang dari luar",
    text:"Bilik tiga punya plat gembok dan gembok yang lebih baru daripada pintu tempatnya disekrup. Kepala sekrupnya masih mengilap, serbuk kayunya masih tertinggal di seratnya. Keduanya dipasang di sisi luar sebuah pintu yang grendelnya ada di dalam — dan grendel itu sudah dilepas, tergeletak di lantai, dengan sekrupnya ditata rapi di sebelahnya."},
  sepatu:{at:"cellar",w:2,name:"Sepatunya yang sebelah",
    text:"Di rak di luar bilik: sebuah ponsel dengan baki SIM ditarik keluar dan diletakkan rapi di sampingnya, segulung lakban, sebotol air, dan satu sepatu. Ukuran 38, aus di tumit kanan, pasangan dari sepatu di rak lorong atas. Di sebelahnya, pemancar monitor bayi, menghadap ke pintu bilik."},
  hitungan:{at:"cellar",w:2,name:"Hitungan di plester dinding",
    text:"Di dinding dalam jangkauan tangan dari pintu bilik, goresan-goresan di plester, dikelompokkan lima-lima, digores dengan sesuatu yang lebih lunak daripada logam. Saya menghitungnya dua kali untuk memastikan. Tiga puluh satu."}

  return `<rect x="0" y="0" width="800" height="450" fill="var(--wall)"/>

  <line x1="0" y1="${floor}" x2="800" y2="${floor}" stroke="var(--line)" stroke-width="2"/>`;
}
function lamp(x,y,r){
  return `<defs><radialGradient id="lg">
    <stop offset="0" stop-color="var(--amber)" stop-opacity="0.12"/>
    <stop offset="0.55" stop-color="var(--amber)" stop-opacity="0.04"/>
    <stop offset="1" stop-color="var(--amber)" stop-opacity="0"/>
  </radialGradient></defs>
  <ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*0.62}" fill="url(#lg)"/>`;
}

function heavy(){ return Object.keys(S.found).filter(k=>CLUES[k].w===3).length; }
function nFound(){ return Object.keys(S.found).length; }
function hhmm(m){ const h=Math.floor(m/60)%24, x=m%60; return String(h).padStart(2,"0")+":"+String(x).padStart(2,"0"); }
function tick(m){ S.clock+=m; }

function say(kind,head,text){
  S.log.push({kind,head,text});
  if(S.log.length>70) S.log.shift();
}

function find(id,extra){
  if(S.found[id]) return false;
  const c=CLUES[id];
  S.found[id]=true;
  say("find",c.name,(extra?extra+" ":"")+c.text);
  SND.find();
  if(c.nerve) nerveUp(c.nerve,5);
  if(!S.gone && S.nerve>=4 && S.creep<CREEPS.length && S.phase==="flat" && S.room!=="cellar"){
    say("cold","Di belakang saya",CREEPS[S.creep++]);
  }
  return true;
}

function nerveUp(n,cap){
  if(S.gone) return;
  const before=S.nerve;
  /* Menggeledah membuatnya gelisah, tapi tidak pernah sampai membuatnya
     kabur: hanya desakan yang mendorongnya melewati angka lima. */
  const lim=Math.min(cap||7,7);
  S.nerve=Math.max(S.nerve,Math.min(S.nerve+n,lim));
  SND.heart(Math.min(6,S.nerve));
  if(before<3 && S.nerve>=3) say("beat","Satu ruangan di belakang","Dia berhenti menawari teh. Sekarang dia mengikuti saya, satu ruangan di belakang. Kalau saya berhenti, langkahnya berhenti setengah langkah kemudian — bukan bersamaan, tapi setelahnya.");
  if(before<5 && S.nerve>=5){
    say("warn","Dia ingin saya keluar","Dia berdiri di pintu lorong dengan punggung menghadap pintu bawah tanah. “Saya rasa Bapak datang lagi saja kalau sudah ada suratnya. Sekarang saya minta Bapak keluar.” Tangan kirinya mengepal dan membuka, mengepal dan membuka.");
    SND.sting();
  }
  if(before<6 && S.nerve>=6 && !S.coat){
    S.coat=true;
    say("warn","Dia mengambil mantelnya","Dia menurunkan parka itu dari gantungan dan menyampirkannya di lengan. Ada bunyi logam kecil dari sakunya, sekali. Dan sekarang dia berdiri lebih dekat ke pintu depan daripada saya.");
    SND.sting();
  }
}

function maybeLeave(){
  if(!S.coat||S.gone||S.down) return;
  S.gone=true;
  SND.door();
  if(S.key){
    say("warn","Pintu depan berbunyi","Dia sudah di tangga sebelum saya sampai ke lorong. Mantel dipakai, tidak bawa apa-apa. Kunci kuningan itu ada di saku saya dan dia tidak tahu.");
  }else{
    say("warn","Pintu depan berbunyi","Dia sudah di tangga dan keluar ke Lindenweg sebelum saya sampai ke lorong. Apa pun yang berbunyi logam di saku itu ikut pergi bersamanya.");
  }
}

  const pips=document.getElementById("pips");
  pips.innerHTML="";
  for(let i=0;i<6;i++){
    const d=document.createElement("span");
    d.className="pip"+(i<S.nerve?" on":"");
    pips.appendChild(d);
  }
  if(S.phase==="title") return renderTitle();
  if(S.phase==="doorstep") return renderDoorstep();
  renderRoom();
}

function renderRoom(){
  mainEl.className="";
  const room=S.room;
  const spots=SPOTS[room]||[];
  const nav = room==="cellar"
    ? [["hall","Naik kembali"]]
    : [["hall","Lorong"],["living","Ruang tamu"],["kitchen","Dapur"],["bath","Kamar mandi"],["bed","Kamar tidur"]];

      <div class="roomhead"><h2>${ROOM_LABEL[room]}</h2><span class="sub">LINDENWEG 14, FLAT 3 · ${hhmm(S.clock)}</span></div>
      <div class="plate${room==="cellar"?" dark":""}" id="plate"></div>
      <div class="moves" id="moves"></div>
    </div>
    <aside class="side"><div class="log" id="log"></div></aside>`;
  const plate=document.getElementById("plate");
  plate.innerHTML=`<svg viewBox="0 0 800 450" aria-label="${ROOM_LABEL[room]}">${ART[room]()}</svg>`;
  spots.forEach(sp=>{
    const done = sp.act ? false : !!S.found[sp.id];
    const b=document.createElement("button");
    b.className="hs"+(done?" done":"")+(sp.red?" act":"");
    b.style.left=sp.x+"%"; b.style.top=sp.y+"%";
    b.innerHTML=`<span class="dot"></span>${sp.label}${done?" ✓":""}`;
    if(done){ b.disabled=true; } else { b.onclick=()=>search(sp); }
    plate.appendChild(b);
  });
  const moves=document.getElementById("moves");
  moves.innerHTML=`<span class="lbl">PERGI KE</span>`;
  nav.forEach(([id,label])=>{
    if(id===room) return;
    const b=document.createElement("button");
    b.className="tool"; b.textContent=label;
    b.onclick=()=>{ SND.ui(); S.room=id; tick(1); maybeLeave(); render(); };
    moves.appendChild(b);
  });
  if(room!=="cellar"){
    const t=document.createElement("button");
    t.className="tool";
    t.textContent = S.gone ? "Dia sudah pergi" : "Bicara dengannya";
    t.disabled = S.gone;
    t.onclick=openTalk;
    moves.appendChild(t);
    const q=document.createElement("button");
    q.className="tool"; q.textContent="Tutup berkas dan pulang";
    q.onclick=openLeave;
    moves.appendChild(q);
  }else if(S.opened){
    const r=document.createElement("button");
    r.className="tool"; r.textContent="Tulis laporan";
    r.onclick=openReport;
    moves.appendChild(r);
  }
  drawLog();
}

function drawLog(){
  const box=document.getElementById("log");
  if(!box) return;
  box.innerHTML="";
  S.log.forEach(e=>{
    const d=document.createElement("div");
    d.className="entry "+e.kind;
    d.innerHTML=`<div class="h">${e.head}</div><p>${e.text}</p>`;
    box.appendChild(d);
  });
  box.scrollTop=box.scrollHeight;
}

/* ============================================================ tindakan */

function search(sp){
  tick(2);
  if(sp.act==="shoes"){
    SND.ui();
    say("beat","Rak sepatu","Tiga pasang miliknya, ukuran 38, aus di tumit kanan. Satu pasang lebih baru, ukuran 40, lumpur kering di jahitannya. Dan satu sepatu dari yang 38, tanpa pasangan di rak.");
    maybeLeave(); return render();
  }
  if(sp.act==="cellar") return tryCellar();
  if(sp.act==="openbay") return openBay();
  if(sp.needs && !S.found[sp.needs]){
    SND.ui();
    say("beat",sp.label,sp.locked);
    maybeLeave(); return render();
  }
  if(sp.id==="monitor") SND.breath();
  find(sp.id);
  if(sp.id==="kunci"){ S.key=true; say("beat","Masuk saku","Kecil, kuningan, mengilap di bahunya. Masuk ke saku saya tanpa dilihat siapa pun."); }
  maybeLeave();
  render();
}

function tryCellar(){
  if(S.key){
    return goDown("Kunci kuningan dari laci dapur itu memutar gemboknya pada percobaan kedua. Platnya jatuh. Di belakang saya dia menyebut nama saya dengan pangkat yang salah, dua kali, makin pelan.");
  }
  const g=heavy();
  if(g>=4){
    return goDown("Tidak ada kunci, tapi isi buku catatan ini akan memuaskan sersan penjaga mana pun di distrik ini: "+g+" barang bukti kuat dan seorang perempuan menjerit di bawah lantai tetangganya. Saya bilang saya akan masuk lewat pintu itu atas dasar yang saya pegang dan dia boleh menonton. Platnya lepas dari kusen dengan dua kali tarikan obeng dapur.");
  }
  SND.sting();
  say("warn","Pintu bawah tanah bertahan","Digembok — dan dari sisi ini, yang merupakan sisi yang salah untuk sebuah bilik bawah tanah. Di bawah daun pintunya, catnya terkelupas dalam garis-garis pendek, dari arah dalam. Yang saya punya baru keterangan seorang nenek. Itu belum cukup untuk melepas pintu orang dari kusennya. Cari kuncinya, atau kumpulkan sesuatu yang tidak bisa disebut tebakan: minimal empat barang bukti kuat. Sekarang saya punya "+g+".");
  maybeLeave();
  render();

function goDown(line){

function modal(node,dismissable){
  closeModal();
  const scrim=document.createElement("div");
  scrim.className="scrim";
  const sheet=document.createElement("div");
  sheet.className="sheet"+(node.dataset&&node.dataset.file?" file":"");
  if(dismissable!==false){
    const x=document.createElement("button");
    x.className="close"; x.textContent="TUTUP"; x.onclick=closeModal;
    sheet.appendChild(x);

  sheet.appendChild(node);
  scrim.appendChild(sheet);
  if(dismissable!==false) scrim.addEventListener("click",e=>{ if(e.target===scrim) closeModal(); });
  host.appendChild(scrim);
}

function grade(){
  const weight=S.picks.reduce((a,id)=>a+CLUES[id].w,0);
  const idOK = S.named==="stesya";
  const chargeOK = S.charge==="full";
  if(!idOK){ S.grade="wrong"; }
  else if(!chargeOK){ S.grade=(S.charge==="victim")?"wrong":"released"; }
  else if(S.custody==="gone"){ S.grade="atlarge"; }
  else if(S.custody==="cage"){ S.grade="wrong"; }
  else if(weight>=8 && S.custody==="both"){ S.grade="complete"; }
  else { S.grade="charged"; }
  S.weight=weight;
}

function openEnding(){
  SND.stop();
  const g=S.grade;
  const E={
    complete:{cls:"good",t:"BERKAS LENGKAP",

      <p>Dua anak perempuan lahir di Kirov pada 4 Juni 1996, dan diberi nama Stesya dan Steffy. Pada umur empat tahun Steffy dibawa keluarga ayahnya dan memakai nama keluarga itu untuk waktu yang lama — sebab itulah tidak ada satu pun saudara kandung yang muncul di berkas 7731-K. Sebelas tahun dia di Birchfield Residential Care, dan dipulangkan pada 2 Oktober dengan sebuah parka, sebuah tas, dan alamat satu-satunya keluarga yang dia punya; keluarga yang selama bertahun-tahun dinasihati untuk tidak membalas suratnya, dan tidak membalas.</p>
